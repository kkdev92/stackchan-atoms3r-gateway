name: scorecard

# OpenSSF Scorecard reads this repository's supply-chain posture — whether actions
# are pinned to SHAs, whether the default branch is protected, whether workflow
# tokens are scoped down, whether a vulnerability can be reported privately.
#
# Other checks test the source, while Scorecard covers repository and publication
# settings. Results appear next to CodeQL in the code scanning dashboard.
#
# The workflow reports findings without changing repository settings.
#
# Enable CodeQL first: the last step uploads SARIF, which needs code scanning on.

on:
  schedule:
    # Run weekly so repository-setting changes are detected promptly.
    - cron: "0 7 * * 1"
  # Branch protection and token permissions are settings rather than code, so a push
  # that does not touch them can still move the score. The default branch is the
  # only meaningful subject.
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: analyse
    runs-on: ubuntu-latest
    permissions:
      # To upload the result to the code scanning dashboard.
      security-events: write
      # For the signed attestation Scorecard publishes about its own run.
      id-token: write
      contents: read
      actions: read
    steps:
      # Pinned to SHAs, which is one of the things this workflow grades.
      # Check for newer releases before copying these into a new repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the result so prospective users can review the score.
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
