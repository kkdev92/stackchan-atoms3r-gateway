name: release

# Publishes the eight Kkdev92.StackChan.* packages to nuget.org.
#
# NuGet.org does not allow a version to be replaced or re-uploaded. Four controls
# protect the publication step:
#
#   1. The whole chain runs again at the tagged commit, rather than trusting an
#      artifact from an earlier run.
#   2. Two jobs, split by what each is trusted with. `verify` builds, tests and
#      packs with no key and no environment; `publish` holds the key and nothing
#      else. A compromised dependency in the build cannot publish anything.
#   3. The `release` environment requires a reviewer, so a tag alone does not
#      publish.
#   4. Trusted Publishing (OIDC) means no long-lived API key exists to leak. The
#      key this run uses is minted for it and expires.
#
# Before the first release: register a Trusted Publishing policy on nuget.org for
# this repository and this workflow file name, reserve the Kkdev92.StackChan.* ID prefix,
# and create the `release` environment with a required reviewer.

on:
  push:
    tags: ["v*"]
  # A manual run is always a dry run: it builds, tests and packs, and the publishing job is gated
  # on the event being a tag push. There is deliberately no input to override that — an option
  # that cannot change the outcome is worse than no option because somebody will rely on it, and
  # one that could publish from an arbitrary branch is worse still.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # No environment here. The `release` environment only permits deployments from a v* tag, so a
  # job carrying it is refused outright on a manual run — which is how the dry run used to fail
  # before it could build anything. Everything that does not need the NuGet key lives here.
  verify:
    name: build, test and pack
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      # Pinned to SHAs. Check for newer releases before copying these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      # The tag name goes through env rather than into the run line, so a tag is
      # data and never becomes shell.
      - name: Check the version and the tag agree
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: pwsh
        run: ./eng/check-version.ps1 -Tag $env:TAG_NAME

      # The full chain, not just pack. The reference host's tests consume the
      # packed packages, so this is what establishes that the artifacts about to
      # be published actually work as packages.
      - name: Build, pack, and test the whole chain
        shell: pwsh
        run: ./eng/build-all.ps1 -Configuration Release

      # Exactly eight packages and eight symbol packages. Only src/sdk is packable; the
      # reference host and the tests are not, so a change that accidentally starts packing one
      # of them shows up here rather than on nuget.org.
      - name: Check the artefact set
        shell: pwsh
        run: |
          $nupkg = @(Get-ChildItem artifacts -Filter *.nupkg)
          $snupkg = @(Get-ChildItem artifacts -Filter *.snupkg)

          if ($nupkg.Count -ne 8 -or $snupkg.Count -ne 8) {
            Write-Error "Expected 8 nupkg and 8 snupkg, found $($nupkg.Count) and $($snupkg.Count)."
            $nupkg + $snupkg | ForEach-Object { "  $($_.Name)" }
            exit 1
          }

          Write-Host 'Packages that a tag push would publish:'
          $nupkg | ForEach-Object { "  $($_.Name)" }

      # Everything downstream consumes this rather than rebuilding. The packages that were tested
      # are the packages that get published; a second build could differ from the one verified.
      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # The only job that holds the NuGet key, and the only one carrying the environment. Gated on a
  # tag push, so a manual run stops after verify with nothing published.
  publish:
    name: push to nuget.org
    needs: verify
    if: github.event_name == 'push'
    runs-on: windows-latest
    environment: release
    permissions:
      # For the OIDC token exchanged for a temporary NuGet key, and nothing else.
      id-token: write
    steps:
      # No checkout. This job needs the packages, not the source, and code it does not check out
      # is code that cannot run while the NuGet key is live.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: NuGet login
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: kkdev92

      - name: Push
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # An unset key is the failure this catches: no Trusted Publishing policy, a mismatched
          # field in it, or a wrong nuget.org profile name all come back as an empty string, and
          # dotnet nuget push would report a confusing authentication error instead of the cause.
          if (-not $env:NUGET_API_KEY) {
            Write-Error ("No API key came back from nuget.org. Check that a Trusted Publishing " +
              "policy exists for this owner, this repository, release.yml and the release " +
              "environment, and that the user below is the nuget.org profile name.")
            exit 1
          }

          # `dotnet nuget push "artifacts/*.nupkg"` fails with "File does not exist". The
          # CLI expands a wildcard only against the current directory, so a pattern carrying a
          # path never matches — measured, and it fails from bash too when the shell is stopped
          # from expanding it first. The bash lanes elsewhere work because the shell resolves
          # the pattern before dotnet sees it; pwsh does not do that for a native command.
          #
          # Every documented example passes either one file or a bare "*.nupkg" from the folder
          # the packages are in. This does the same: enumerate, then push by name from there.
          $packages = @(Get-ChildItem artifacts -Filter *.nupkg)

          if ($packages.Count -ne 8) {
            Write-Error "Expected 8 packages to push, found $($packages.Count)."
            exit 1
          }

          # Pushed from inside artifacts, by file name. A .snupkg is published automatically
          # with its .nupkg, but only when both sit in the same folder as the push is made from
          # (documented on Learn: "Both .nupkg and .snupkg files need to be present in the
          # current folder"). Passing an absolute path from elsewhere would publish the
          # assemblies and silently leave the symbols behind.
          Set-Location artifacts

          # No --skip-duplicate. A version already on nuget.org means this tag has been published
          # before, and continuing would attach today's build to yesterday's version while
          # reporting success. Failing is the only honest outcome; nuget.org cannot replace a
          # published version, so the fix is always a new one.
          foreach ($package in $packages) {
            Write-Host "pushing $($package.Name)"

            dotnet nuget push $package.Name `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Pushing $($package.Name) failed. Packages pushed before it are on nuget.org and cannot be replaced; fix the cause and publish a new version."
              exit $LASTEXITCODE
            }
          }
